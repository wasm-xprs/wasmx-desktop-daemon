[package]
name = "wasmx-desktop-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Loopback Wasmtime FaaS control plane for wasm-xprs"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
wasmtime = { version = "49.0.1", default-features = false, features = ["anyhow", "cranelift", "runtime", "std"] }

[dev-dependencies]
wat = "1"

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
needless_return = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
