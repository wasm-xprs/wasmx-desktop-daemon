name: apply-cap-directory-permission-fix

on:
  push:
    branches:
      - DEN-1862-capability-artifact-fs
    paths:
      - tools/fix_cap_directory_permissions.py
      - .github/workflows/apply-cap-directory-permission-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: DEN-1862-capability-artifact-fs
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.0
          components: rustfmt
      - name: Apply fix, test focused regressions, and remove helper
        run: |
          python3 tools/fix_cap_directory_permissions.py
          cargo fmt --all
          cargo test --all-targets new_deployment_chain_preserves_missing_leaf_until_publish
          cargo test --all-targets cached_module_revalidates_persisted_bytes_before_reuse
          git diff --check
          git rm tools/fix_cap_directory_permissions.py .github/workflows/apply-cap-directory-permission-fix.yml
          git config user.name ORESoftware
          git config user.email alex@oresoftware.com
          git add src/main.rs
          git commit -m 'fix: harden child permissions through parent capability'
          git push origin HEAD:DEN-1862-capability-artifact-fs
