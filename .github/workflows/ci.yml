name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.90.0'
          components: clippy,rustfmt
      - run: cargo +1.90.0 fmt --all -- --check
      - run: cargo +1.90.0 check --all-targets
      - run: cargo +1.90.0 test --all-targets
      - run: cargo +1.90.0 clippy --all-targets -- -D warnings
