name: ci

on:
  push:
    branches: [main, fix/ores-adapter-current-schema-20260927]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install declared MSRV
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - name: Prepare dependency lock for audit
        shell: bash
        run: |
          if git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            cargo +1.96.0 fetch --locked
          else
            cargo +1.96.0 generate-lockfile
          fi
      - name: Publish generated lock candidate
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cargo-lock-candidate
          path: Cargo.lock
          if-no-files-found: error
      - name: Bootstrap deterministic lockfile onto same-repo PR branch
        if: matrix.os == 'ubuntu-latest' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref_name == 'fix/ores-adapter-current-schema-20260927'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          if git ls-tree -r --name-only "origin/$HEAD_REF" 2>/dev/null | grep -qx Cargo.lock; then
            exit 0
          fi
          encoded="$(base64 -w0 Cargo.lock)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/Cargo.lock" \
            -f message='chore: commit deterministic Cargo.lock' \
            -f branch="$HEAD_REF" \
            -f content="$encoded"
          git add Cargo.lock
      - name: Format
        run: cargo +1.96.0 fmt --all -- --check
      - name: Check
        run: cargo +1.96.0 check --locked --all-targets
      - name: Test
        run: cargo +1.96.0 test --locked
      - name: Clippy
        run: cargo +1.96.0 clippy --locked --all-targets -- -D warnings
      - name: Require committed deterministic lockfile
        shell: bash
        run: |
          git ls-files --error-unmatch Cargo.lock >/dev/null
          git diff --exit-code -- Cargo.lock
