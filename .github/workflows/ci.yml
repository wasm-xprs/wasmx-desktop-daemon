name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.96.0"
          components: clippy,rustfmt
      - run: cargo +1.96.0 fmt --all -- --check
      - run: cargo +1.96.0 check --all-targets
      - run: cargo +1.96.0 test --all-targets
      - run: cargo +1.96.0 clippy --all-targets -- -D warnings
