name: pr28-autofix

on:
  push:
    branches:
      - fix/first-deploy-and-token-admission

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.0
          components: rustfmt
      - name: Apply exact lint fix and rustfmt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main.rs')
          text = path.read_text()
          old = '        let error = load_or_create_token(&path).expect_err("weak token mode must fail closed");\n'
          new = '''        let error = match load_or_create_token(&path) {
              Ok(_) => bail!("weak token mode must fail closed"),
              Err(error) => error,
          };
          '''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          cargo fmt --all
          git diff --check
      - name: Commit verified formatting fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'ORESoftware'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.rs
          git commit -m 'test: satisfy rustfmt and strict clippy'
          git push origin HEAD:fix/first-deploy-and-token-admission
