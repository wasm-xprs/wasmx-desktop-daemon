name: apply-unique-port
on:
  push:
    branches:
      - fix/unique-desktop-port-8766
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply exact transform
        run: python3 tools/apply_unique_port.py
      - name: Format
        run: cargo fmt --all
      - name: Test
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Commit source-only result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-unique-port.yml tools/apply_unique_port.py
          git add src/main.rs README.md
          git commit -m 'fix: move wasm-xprs daemon to unique port 8766'
          git push
