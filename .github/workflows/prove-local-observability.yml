name: prove local observability

on:
  push:
    branches:
      - proof/local-observability-20260929

permissions:
  contents: read

jobs:
  ores-compose-exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install exact Rust 1.98.1 toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - name: Fetch exact ores-compose PR head
        shell: bash
        run: |
          set -euo pipefail
          git init ores-compose
          cd ores-compose
          git remote add origin https://github.com/ORESoftware/ores-compose.git
          git fetch --depth=1 origin dacbf0d697321ee1f625ed71a852e3faf05a9a99
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 'dacbf0d697321ee1f625ed71a852e3faf05a9a99'
          grep -F 'rev = "e97e4613764d8432321ff9b7e1aacdda50da6830"' Cargo.toml
      - id: fmt
        name: Format check exact compose head
        continue-on-error: true
        working-directory: ores-compose
        run: cargo +1.98.1 fmt -- --check
      - id: check
        name: Check exact compose head
        continue-on-error: true
        working-directory: ores-compose
        run: cargo +1.98.1 check --locked
      - id: test
        name: Test exact compose head
        continue-on-error: true
        working-directory: ores-compose
        run: cargo +1.98.1 test --locked
      - id: clippy
        name: Clippy exact compose head
        continue-on-error: true
        working-directory: ores-compose
        run: cargo +1.98.1 clippy --locked --all-targets -- -D warnings
      - name: Enforce compose verification
        if: always()
        shell: bash
        env:
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
        run: |
          set -euo pipefail
          printf 'fmt=%s check=%s test=%s clippy=%s\n' "$FMT_OUTCOME" "$CHECK_OUTCOME" "$TEST_OUTCOME" "$CLIPPY_OUTCOME"
          test "$FMT_OUTCOME" = success
          test "$CHECK_OUTCOME" = success
          test "$TEST_OUTCOME" = success
          test "$CLIPPY_OUTCOME" = success
