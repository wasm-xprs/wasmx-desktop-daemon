name: prove local observability

on:
  push:
    branches:
      - proof/local-observability-20260929

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify private-source manifest blobs and receipt
        shell: bash
        run: |
          set -euo pipefail
          root='proof/local-observability'
          test "$(git hash-object "$root/source-root-Cargo.toml")" = '689d280bb7c671b2357b4174f2fef01363d66333'
          test "$(git hash-object "$root/source-daemon-Cargo.toml")" = '461ac385ebc91bf86a73ee3f0a0fdc57c91a745d'
          jq -e '.common_head == "2c83ef1c276519c8803ec52e2f01402235274444"' "$root/SOURCE.json" >/dev/null
          jq -e '.ores_otel_head == "e97e4613764d8432321ff9b7e1aacdda50da6830"' "$root/SOURCE.json" >/dev/null
          grep -F 'rust-version = "1.82"' "$root/source-root-Cargo.toml"
          grep -F 'rev = "e97e4613764d8432321ff9b7e1aacdda50da6830"' "$root/source-daemon-Cargo.toml"

  ores-otel-compat-candidate-1-82:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install exact Rust 1.82 toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.82.0'
          components: rustfmt, clippy
      - name: Fetch exact ores-otel source head
        shell: bash
        run: |
          set -euo pipefail
          git init ores-otel
          cd ores-otel
          git remote add origin https://github.com/ores-otel/ores.otel.log.git
          git fetch --depth=1 origin e97e4613764d8432321ff9b7e1aacdda50da6830
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 'e97e4613764d8432321ff9b7e1aacdda50da6830'
      - name: Apply minimal reviewed compatibility candidate
        working-directory: ores-otel
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('sdk/rust/Cargo.toml')
          text = manifest.read_text()
          text = text.replace('rust-version = "1.88"', 'rust-version = "1.82"')
          text = '\n'.join(
              line for line in text.splitlines()
              if not line.startswith('time = { version = "=0.3.54"')
          ) + '\n'
          manifest.write_text(text)

          desktop = Path('sdk/rust/src/desktop.rs')
          text = desktop.read_text()
          old = (
              '            Err(error) if error.kind() == std::io::ErrorKind::DirectoryNotEmpty => return Ok(true),\n'
              '            Err(error) => return Err(LoggerError(error.to_string())),\n'
          )
          new = (
              '            Err(error) => {\n'
              '                let became_non_empty = fs::read_dir(path)\n'
              '                    .map(|mut entries| entries.next().is_some())\n'
              '                    .unwrap_or(false);\n'
              '                if became_non_empty {\n'
              '                    return Ok(true);\n'
              '                }\n'
              '                return Err(LoggerError(error.to_string()));\n'
              '            }\n'
          )
          if old not in text:
              raise SystemExit('expected DirectoryNotEmpty source pattern not found')
          desktop.write_text(text.replace(old, new))
          PY
          grep -F 'rust-version = "1.82"' sdk/rust/Cargo.toml
          if grep -F 'time = ' sdk/rust/Cargo.toml; then
            echo 'time dependency was not removed' >&2
            exit 1
          fi
          if grep -F 'ErrorKind::DirectoryNotEmpty' sdk/rust/src/desktop.rs; then
            echo 'newer DirectoryNotEmpty API remains' >&2
            exit 1
          fi
          rm -f Cargo.lock
      - name: Format compatibility candidate
        working-directory: ores-otel
        run: cargo +1.82.0 fmt --manifest-path sdk/rust/Cargo.toml -- --check
      - name: Check compatibility candidate
        working-directory: ores-otel
        run: cargo +1.82.0 check -p oresoftware-next-loggers
      - name: Test compatibility candidate
        working-directory: ores-otel
        run: cargo +1.82.0 test -p oresoftware-next-loggers
      - name: Clippy compatibility candidate
        working-directory: ores-otel
        run: cargo +1.82.0 clippy -p oresoftware-next-loggers --all-targets -- -D warnings
