name: prove local observability

on:
  push:
    branches:
      - proof/local-observability-20260929

permissions:
  contents: read

jobs:
  ores-otel-locked-rust-1-82:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install exact Rust 1.82 toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.82.0'
          components: rustfmt, clippy
      - name: Fetch exact committed ores-otel PR head
        shell: bash
        run: |
          set -euo pipefail
          git init ores-otel
          cd ores-otel
          git remote add origin https://github.com/ores-otel/ores.otel.log.git
          git fetch --depth=1 origin 2fcbe1fcf462ee9c5c2b3459333c49d1ed8d0cfd
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = '2fcbe1fcf462ee9c5c2b3459333c49d1ed8d0cfd'
          test "$(git hash-object Cargo.lock)" = 'c2bd8671d392e8afd6d749448f277cce30294b6f'
          test "$(git hash-object sdk/rust/src/desktop.rs)" = 'a87056bd70ddfe16c0ef4444a9ca065d56d28ae8'
          test "$(git hash-object sdk/rust/src/local_journal.rs)" = 'a7a5ccd040c14d33a316f818739f58be1877af17'
          test "$(git hash-object sdk/rust/src/local_triage.rs)" = '5893b24ca8d1527d693ef694a23c8702e4fb154a'
          grep -F 'rust-version = "1.82"' sdk/rust/Cargo.toml
          ! grep -F '^time = ' sdk/rust/Cargo.toml
          ! grep -E '^name = "(time|time-core|time-macros)"$' Cargo.lock
      - name: Rustfmt exact committed head
        working-directory: ores-otel
        run: cargo +1.82.0 fmt --manifest-path sdk/rust/Cargo.toml -- --check
      - name: Check exact committed head locked
        working-directory: ores-otel
        run: cargo +1.82.0 check --locked -p oresoftware-next-loggers
      - name: Test exact committed head locked
        working-directory: ores-otel
        run: cargo +1.82.0 test --locked -p oresoftware-next-loggers
      - name: Clippy exact committed head locked
        working-directory: ores-otel
        run: cargo +1.82.0 clippy --locked -p oresoftware-next-loggers --all-targets -- -D warnings
      - name: Verify no mutation
        working-directory: ores-otel
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git hash-object Cargo.lock)" = 'c2bd8671d392e8afd6d749448f277cce30294b6f'
