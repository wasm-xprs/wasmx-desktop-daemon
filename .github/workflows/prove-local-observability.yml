name: prove local observability

on:
  push:
    branches:
      - proof/local-observability-20260929

permissions:
  contents: read

jobs:
  ores-otel-rust-1-82-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install exact Rust 1.82 toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.82.0'
          components: rustfmt, clippy
      - name: Fetch exact ores-otel PR head
        shell: bash
        run: |
          set -euo pipefail
          git init ores-otel
          cd ores-otel
          git remote add origin https://github.com/ores-otel/ores.otel.log.git
          git fetch --depth=1 origin 44b0fdf2f38468e046fe9446affb202d4d619d28
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = '44b0fdf2f38468e046fe9446affb202d4d619d28'
          grep -F 'rust-version = "1.82"' sdk/rust/Cargo.toml
          ! grep -F '^time = ' sdk/rust/Cargo.toml
      - name: Apply mechanical Clippy fixes and rustfmt
        working-directory: ores-otel
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          journal = Path('sdk/rust/src/local_journal.rs')
          text = journal.read_text()
          old = 'max_bytes.min(8 * 1024).max(1)'
          if old not in text:
              raise SystemExit('local journal clamp pattern not found')
          journal.write_text(text.replace(old, 'max_bytes.clamp(1, 8 * 1024)', 1))

          triage = Path('sdk/rust/src/local_triage.rs')
          text = triage.read_text()
          pattern = re.compile(
              r'usize::try_from\(remaining_budget\)\s*'
              r'\.unwrap_or\(usize::MAX\)\s*'
              r'\.min\(DEFAULT_TRIAGE_MAX_LINE_CHUNK_BYTES\)\s*'
              r'\.max\(1\)'
          )
          replacement = (
              'usize::try_from(remaining_budget)\n'
              '                .unwrap_or(usize::MAX)\n'
              '                .clamp(1, DEFAULT_TRIAGE_MAX_LINE_CHUNK_BYTES)'
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'triage clamp substitutions: {count}')
          triage.write_text(text)
          PY
          cargo +1.82.0 fmt --manifest-path sdk/rust/Cargo.toml
          rm -f Cargo.lock
      - name: Verify format
        working-directory: ores-otel
        run: cargo +1.82.0 fmt --manifest-path sdk/rust/Cargo.toml -- --check
      - name: Check candidate
        working-directory: ores-otel
        run: cargo +1.82.0 check -p oresoftware-next-loggers
      - name: Test candidate
        working-directory: ores-otel
        run: cargo +1.82.0 test -p oresoftware-next-loggers
      - name: Clippy candidate
        working-directory: ores-otel
        run: cargo +1.82.0 clippy -p oresoftware-next-loggers --all-targets -- -D warnings
      - name: Assert dependency and lock invariants
        working-directory: ores-otel
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F '^time = ' sdk/rust/Cargo.toml
          ! grep -E '^name = "(time|time-core|time-macros)"$' Cargo.lock
          grep -F 'rust-version = "1.82"' sdk/rust/Cargo.toml
          git diff --stat -- Cargo.lock sdk/rust/src/desktop.rs sdk/rust/src/local_journal.rs sdk/rust/src/local_triage.rs
      - name: Export verified source and lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ores-otel-rust-1-82-verified
          path: |
            ores-otel/Cargo.lock
            ores-otel/sdk/rust/src/desktop.rs
            ores-otel/sdk/rust/src/local_journal.rs
            ores-otel/sdk/rust/src/local_triage.rs
          if-no-files-found: error
          retention-days: 1
