name: replay-ores-receipt-verification

on:
  push:
    branches:
      - feature/verify-ores-wasm-receipt-v2-20260928

permissions:
  contents: write

jobs:
  replay:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/verify-ores-wasm-receipt-v2-20260928
      - name: Replay receipt verification and run strict Rust gates
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/verify-ores-wasm-receipt-20260928
          git diff 9b7a5cba13930ab0e90c72ef5989b57925468de1..origin/feature/verify-ores-wasm-receipt-20260928 -- src/main.rs src/ores_receipt.rs > /tmp/receipt.patch
          test -s /tmp/receipt.patch
          git apply --3way --index /tmp/receipt.patch
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/ores_receipt.rs')
          text = path.read_text()
          text = text.replace(
              '    fn adapter_bytes() -> Vec<u8> {\n        return serde_json::to_vec(',
              '    fn adapter_bytes() -> Result<Vec<u8>> {\n        let bytes = serde_json::to_vec(',
              1,
          )
          text = text.replace(
              '        }))\n        .expect("adapter JSON");\n',
              '        }))?;\n        return Ok(bytes);\n',
              1,
          )
          text = text.replace(
              '    fn receipt_bytes(adapter: &[u8], module: &[u8]) -> Vec<u8> {\n        return serde_json::to_vec(',
              '    fn receipt_bytes(adapter: &[u8], module: &[u8]) -> Result<Vec<u8>> {\n        let bytes = serde_json::to_vec(',
              1,
          )
          text = text.replace(
              '        }))\n        .expect("receipt JSON");\n',
              '        }))?;\n        return Ok(bytes);\n',
              1,
          )
          text = text.replace('        let adapter_bytes = adapter_bytes();\n', '        let adapter_bytes = adapter_bytes()?;\n')
          text = text.replace('        let receipt = receipt_bytes(&adapter_bytes, module);\n', '        let receipt = receipt_bytes(&adapter_bytes, module)?;\n')
          text = text.replace('        let receipt = receipt_bytes(&adapter_bytes, b"wasm-module");\n', '        let receipt = receipt_bytes(&adapter_bytes, b"wasm-module")?;\n')
          text = text.replace('serde_json::from_slice(&adapter_bytes).unwrap();', 'serde_json::from_slice(&adapter_bytes)?;', 1)
          text = text.replace(
              '        assert!(verify(&structured, &adapter_bytes, &receipt, b"other-module").is_err());\n    }\n}\n',
              '        assert!(verify(&structured, &adapter_bytes, &receipt, b"other-module").is_err());\n        return Ok(());\n    }\n}\n',
              1,
          )
          path.write_text(text)
          PY
          cargo fmt --all
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
          git add src/main.rs src/ores_receipt.rs
          git rm .github/workflows/replay-ores-receipt-verification.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'hardening: verify ORES WASM artifact receipts at deploy admission'
          git push origin HEAD:feature/verify-ores-wasm-receipt-v2-20260928
